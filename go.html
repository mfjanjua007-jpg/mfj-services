<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting... | MFJ Service</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:'Inter',sans-serif; background:#F6F8FA; color:#152238; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center;}
.box{padding:30px;}
a{color:#0F8A5F; font-weight:700;}
</style>
</head>
<body>
<div class="box">
  <p id="msg">لنک تلاش ہو رہا ہے...</p>
</div>
<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const code = params.get('c');
  const msg = document.getElementById('msg');
  if(!code){ msg.textContent = 'کوئی کوڈ نہیں دیا گیا۔'; return; }
  try{
    const client = window.supabase.createClient(
      'https://ixgsartlktmgqfnzzatv.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4Z3NhcnRsa3RtZ3Fmbnp6YXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5NzQwODYsImV4cCI6MjA5ODU1MDA4Nn0.QP6CRf3oGS8cvQMcF8uDU-vZ7YOVfPWUJsjqQ2G6T_8'
    );
    const { data, error } = await client.from('short_urls').select('target').eq('code', code).single();
    if(error || !data){ msg.innerHTML = 'یہ لنک نہیں ملا — شاید ختم ہو چکا ہے۔ <br><a href="index.html">← ویب سائٹ پر واپس جائیں</a>'; return; }
    location.href = data.target;
  }catch(e){ msg.textContent = 'کچھ غلط ہو گیا، دوبارہ کوشش کریں۔'; }
})();
</script>
</body>
</html>
