*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}

.sm-topbar{background:var(--navy); color:#fff; padding:12px 5%; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}

.sm-brand span.sub{font-weight:500; font-size:12px; color:#cfe9de; display:block;}

.sm-nav{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:10px; position:sticky; top:16px; max-height:85vh; overflow-y:auto;}

.sm-panel p.desc{color:var(--mute); font-size:13.5px; margin-bottom:18px;}

.sm-drop{border:2px dashed var(--border); border-radius:12px; padding:26px; text-align:center; cursor:pointer; background:var(--bg); margin-bottom:14px;}
.sm-drop:hover,.sm-drop.drag{border-color:var(--green); background:var(--green-light);}

<script>
let activeTool = 'resize';
document.querySelectorAll('.sm-nav-item[data-tool]').forEach(item=>{
  item.addEventListener('click', ()=>{
    document.querySelectorAll('.sm-nav-item').forEach(i=>i.classList.remove('active'));
    item.classList.add('active');
    activeTool = item.dataset.tool;
    renderTool(activeTool);
  });
});
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}
function loadImageFile(file){
  return new Promise(res=>{ const r=new FileReader(); r.onload=e=>{ const img=new Image(); img.onload=()=>res(img); img.src=e.target.result; }; r.readAsDataURL(file); });
}
function dropZoneHTML(id, label){
  return `<div class="sm-drop" id="${id}_drop"><span class="ic">🖼️</span><div>${label}</div><input type="file" id="${id}" accept="image/*"></div>`;
}
function wireDropZone(id, onFile){
  const drop = document.getElementById(id+'_drop'); const input = document.getElementById(id);
  drop.addEventListener('click', ()=> input.click());
  input.addEventListener('change', ()=>{ if(input.files[0]) onFile(input.files[0]); });
  ['dragover','dragleave','drop'].forEach(evt=>{
    drop.addEventListener(evt, e=>{
      e.preventDefault(); drop.classList.toggle('drag', evt==='dragover');
      if(evt==='drop' && e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]);
    });
  });
}
/* Adds a tiny "MFJ Service" credit in the bottom-right corner of a generated composition canvas. */
function addMfjWatermarkCanvas(canvas){
  const ctx = canvas.getContext('2d');
  const text = 'MFJ Service';
  ctx.save();
  ctx.font = `${Math.max(10, canvas.width*0.014)}px Inter, sans-serif`;
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  const pad = canvas.width*0.015;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillText(text, canvas.width-pad+1, canvas.height-pad+1);
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText(text, canvas.width-pad, canvas.height-pad);
  ctx.restore();
}
function downloadCanvas(id, filename){
  document.getElementById(id).toBlob(b=> downloadBlob(b, filename), 'image/png');
}

/* ===================== RESIZER (cover-fit crop) ===================== */
function drawResize(){
  if(!window.__rzImg) return;
  const img = window.__rzImg;
  const preset = PLATFORM_SIZES[document.getElementById('rzPlatform').value];
  const canvas = document.getElementById('rzCanvas');
  const scaleDisplay = Math.min(1, 500/preset.w);
  canvas.width = preset.w; canvas.height = preset.h;
  canvas.style.width = (preset.w*scaleDisplay)+'px'; canvas.style.height = (preset.h*scaleDisplay)+'px';
  const ctx = canvas.getContext('2d');
  const scale = Math.max(preset.w/img.width, preset.h/img.height);
  const dw=img.width*scale, dh=img.height*scale;
  ctx.drawImage(img, (preset.w-dw)/2, (preset.h-dh)/2, dw, dh);
}

/* ===================== THUMBNAIL ===================== */
function drawThumbnail(){
  const canvas = document.getElementById('thCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,1280,720);
  ctx.fillStyle = '#0F2A3D'; ctx.fillRect(0,0,1280,720);
  if(window.__thImg){
    const img = window.__thImg;
    const scale = Math.max(1280/img.width, 720/img.height);
    const dw=img.width*scale, dh=img.height*scale;
    ctx.drawImage(img, (1280-dw)/2, (720-dh)/2, dw, dh);
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,0,1280,720);
  }
  const text = document.getElementById('thText').value || '';
  const color = document.getElementById('thColor').value;
  const size = +document.getElementById('thSize').value;
  ctx.font = `900 ${size}px Inter, sans-serif`;
  ctx.fillStyle = color; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.strokeStyle = '#000'; ctx.lineWidth = size*0.06;
  const words = text.split(' '); let lines=[], cur='';
  words.forEach(w=>{ const test=cur?cur+' '+w:w; if(ctx.measureText(test).width>1100 && cur){ lines.push(cur); cur=w; } else cur=test; });
  if(cur) lines.push(cur);
  const startY = 360 - ((lines.length-1)*(size+10))/2;
  lines.forEach((l,i)=>{ ctx.strokeText(l, 640, startY+i*(size+10)); ctx.fillText(l, 640, startY+i*(size+10)); });
  addMfjWatermarkCanvas(canvas);
}

/* ===================== BANNER ===================== */
function drawBanner(){
  const preset = PLATFORM_SIZES[document.getElementById('bnPlatform').value];
  const canvas = document.getElementById('bnCanvas');
  canvas.width = preset.w; canvas.height = preset.h;
  const scaleDisplay = Math.min(1, 700/preset.w);
  canvas.style.width=(preset.w*scaleDisplay)+'px'; canvas.style.height=(preset.h*scaleDisplay)+'px';
  const ctx = canvas.getContext('2d');
  const c1 = document.getElementById('bnColor1').value, c2 = document.getElementById('bnColor2').value;
  const grad = ctx.createLinearGradient(0,0,preset.w,preset.h);
  grad.addColorStop(0,c1); grad.addColorStop(1,c2);
  ctx.fillStyle = grad; ctx.fillRect(0,0,preset.w,preset.h);
  ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.font = `800 ${preset.h*0.14}px Inter, sans-serif`;
  ctx.fillText(document.getElementById('bnTitle').value||'', preset.w/2, preset.h/2 - preset.h*0.02, preset.w-80);
  ctx.font = `500 ${preset.h*0.07}px Inter, sans-serif`;
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.fillText(document.getElementById('bnSub').value||'', preset.w/2, preset.h/2 + preset.h*0.14, preset.w-80);
  addMfjWatermarkCanvas(canvas);
}

/* ===================== PROFILE PICTURE ===================== */
function drawProfile(){
  if(!window.__pfImg) return;
  const img = window.__pfImg;
  const canvas = document.getElementById('pfCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,500,500);
  ctx.save();
  ctx.beginPath(); ctx.arc(250,250,250,0,Math.PI*2); ctx.clip();
  const scale = Math.max(500/img.width, 500/img.height);
  const dw=img.width*scale, dh=img.height*scale;
  ctx.drawImage(img, (500-dw)/2, (500-dh)/2, dw, dh);
  ctx.restore();
}

/* ===================== HASHTAG GENERATOR ===================== */
const GENERIC_TAGS = ['pakistan','business','smallbusiness','entrepreneur','marketing','growth','success','trending','viral','explore'];
function generateHashtags(){
  const topics = document.getElementById('htTopic').value.split(',').map(t=>t.trim()).filter(Boolean);
  if(topics.length===0){ alert('کچھ الفاظ لکھیں'); return; }
  const tags = new Set();
  topics.forEach(t=>{
    const clean = t.replace(/\s+/g,'');
    tags.add('#'+clean);
    t.split(' ').forEach(w=> w.length>2 && tags.add('#'+w.toLowerCase()));
  });
  topics.forEach(t=> tags.add('#'+t.replace(/\s+/g,'')+'pakistan'));
  GENERIC_TAGS.forEach(t=> tags.add('#'+t));
  const out = document.getElementById('htOut');
  out.style.display='block';
  out.innerHTML = [...tags].slice(0,25).map(t=>`<span class="sm-tag">${t}</span>`).join(' ');
}
