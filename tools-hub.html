*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Inter','Noto Nastaliq Urdu',sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; visibility:hidden;}

.th-topbar{background:var(--glass-surface,rgba(255,255,255,.85)); backdrop-filter:blur(10px); padding:14px 5%; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(15,42,61,.06); border-bottom:1px solid var(--border);}
.th-logo-wrap{display:flex; align-items:center; gap:11px; text-decoration:none;}
.th-logo-icon{perspective:800px; border-radius:50%; width:50px; height:50px; background:#fff; background-image:var(--mfj-logo); background-size:66%; background-repeat:no-repeat; background-position:center; box-shadow:0 4px 14px rgba(15,138,95,.3); flex-shrink:0;}
.th-logo-text{line-height:1.15;}
.th-logo-text .l1{font-size:19px; font-weight:800; color:var(--ink); letter-spacing:.3px;}
.th-logo-text .brand-mfj{font-family:'Poppins',sans-serif; font-weight:900; font-size:1.08em; letter-spacing:.4px; background:linear-gradient(135deg,var(--green) 10%,#0F8A5F 55%,var(--green-dark) 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
.th-logo-text .brand-service{font-family:'Inter',sans-serif; font-weight:800;}
.th-logo-text .l2{font-size:9.5px; font-weight:700; color:var(--green); letter-spacing:2px;}
.th-back{color:var(--ink); text-decoration:none; background:var(--bg); border:1.5px solid var(--border); padding:9px 16px; border-radius:9px; font-size:13.5px; font-weight:700; transition:.15s;}
.th-back:hover{background:var(--green-light); border-color:var(--green);}

.th-hero{background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; padding:50px 5% 60px; text-align:center;}
.th-hero h1{font-size:26px; margin-bottom:8px;}
.th-hero p{color:#cfe9de; font-size:14.5px; margin-bottom:28px;}
.th-search-wrap{max-width:600px; margin:0 auto; position:relative;}
.th-search{width:100%; padding:16px 20px; border-radius:14px; border:none; font-size:16px; font-family:inherit; box-shadow:0 10px 30px rgba(0,0,0,.25);}
.th-search:focus{outline:3px solid var(--green);}
.th-suggestions{position:absolute; top:calc(100% + 8px); insetInlineStart:0; right:0; left:0; background:#fff; border-radius:12px; box-shadow:0 12px 30px rgba(0,0,0,.2); overflow:hidden; z-index:50; display:none; text-align:right;}
.th-suggestions.show{display:block;}
.th-suggest-item{padding:12px 18px; cursor:pointer; color:var(--ink); font-size:14px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border);}
.th-suggest-item:last-child{border-bottom:none;}
.th-suggest-item:hover{background:var(--green-light);}
.th-suggest-item .cat{margin-inline-start:auto; font-size:11px; color:var(--mute);}

.th-body{max-width:1100px; margin:0 auto; padding:30px 16px 60px;}
.th-section-title{font-size:17px; color:var(--navy); margin-bottom:14px; font-weight:700;}
.th-popular{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:36px;}
.th-pop-chip{background:var(--panel); border:1.5px solid var(--border); border-radius:20px; padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none; color:var(--ink);}
.th-pop-chip:hover{border-color:var(--green); background:var(--green-light);}

.th-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
.th-card{background:var(--panel); border:1.5px solid var(--border); border-radius:16px; padding:20px; text-decoration:none; color:var(--ink); transition:.15s; display:block;}
.th-card:hover{border-color:var(--green); transform:translateY(-3px); box-shadow:0 10px 24px rgba(15,42,61,.1);}
.th-card .ic{font-size:30px; margin-bottom:10px; display:block;}
.th-card h3{font-size:15px; margin-bottom:4px; color:var(--navy);}
.th-card p{font-size:12px; color:var(--mute);}
.th-card .count{display:inline-block; margin-top:8px; background:var(--green-light); color:var(--green-dark); font-size:11px; font-weight:800; padding:3px 10px; border-radius:20px;}
.th-card.disabled{opacity:.4; pointer-events:none;}
.th-empty{text-align:center; padding:40px; color:var(--mute);}
</style>

/* ===================== SEARCH ===================== */
function normalize(s){ return s.toLowerCase().trim(); }
function searchTools(query){
  const q = normalize(query);
  if(!q) return [];
  const terms = q.split(/\s+/).filter(Boolean);
  const scored = SEARCH_INDEX.map(item=>{
    const haystack = normalize(item.label + ' ' + item.kw.join(' '));
    let score = 0;
    if(haystack.includes(q)) score += 10;
    terms.forEach(t=>{ if(haystack.includes(t)) score += 2; });
    return {item, score};
  }).filter(x=>x.score>0);
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,8).map(x=>x.item);
}
const searchInput = document.getElementById('thSearch');
const suggestBox = document.getElementById('thSuggestions');
searchInput.addEventListener('input', ()=>{
  const results = searchTools(searchInput.value);
  if(results.length===0){ suggestBox.classList.remove('show'); return; }
  suggestBox.innerHTML = results.map(r=>`<div class="th-suggest-item" onclick="goToTool('${r.page}','${r.tool||''}')">🔧 ${r.label}<span class="cat">${r.cat}</span></div>`).join('');
  suggestBox.classList.add('show');
});
searchInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const results = searchTools(searchInput.value);
    if(results.length>0) goToTool(results[0].page, results[0].tool||'');
    else alert('کوئی مماثل ٹول نہیں ملا — نیچے کیٹیگریز میں دیکھیں۔');
  }
});
document.addEventListener('click', e=>{ if(!e.target.closest('.th-search-wrap')) suggestBox.classList.remove('show'); });
function goToTool(page, tool){
  location.href = tool ? `${page}?tool=${tool}` : page;
}

/* ===================== CATEGORY GRID (respects admin toggles) ===================== */
async function renderCategories(){
  const grid = document.getElementById('categoryGrid');
  grid.innerHTML = CATEGORIES.map(c=>`
    <a class="th-card" id="cat_${c.key}" href="${c.page}">
      <span class="ic">${c.icon}</span>
      <h3>${c.title}</h3>
      <p>${c.desc}</p>
      <span class="count">${c.count}+ ٹولز</span>
    </a>`).join('');

  for(const c of CATEGORIES){
    try{
      const { data, error } = await sbClient.from('site_settings').select('value').eq('key', c.key).single();
      if(!error && data && data.value===false){
        const el = document.getElementById('cat_'+c.key);
        el.classList.add('disabled');
        el.querySelector('p').textContent = 'فی الحال دستیاب نہیں';
      }
    }catch(e){ /* fail open — leave enabled */ }
  }
}
renderCategories();
